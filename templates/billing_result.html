{% extends "layout.html" %}

{% block title %}{{ title }} - {% if not branding.is_default %}{{ branding.brand_name }} - {% endif %}CrewLog{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto text-center space-y-6 py-12">
    <div class="text-6xl">{{ icon }}</div>
    <h1 class="text-3xl font-bold maritime-header">{{ title }}</h1>
    <p class="text-lg">{{ message }}</p>
    <p class="text-sm ui-muted">{{ sub_message }}</p>
    <a href="{{ link_url }}" class="btn btn-primary inline-block text-white px-6 py-3 rounded-lg font-bold transition hover:scale-105 shadow-lg">
        {{ link_text }}
    </a>
</div>
{% endblock %}
