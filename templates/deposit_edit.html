{% extends "layout.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold maritime-header mb-6" style="color: var(--navy-deep);">✏️ {{ t('deposit.edit_deposit') }}</h1>
    
    <form method="post" class="bg-white porthole-card p-6 space-y-4">
        {{ csrf_input | safe }}
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">👤 {{ t('common.member') }} *</label>
            <select name="member_id" required class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue);">
                {% for member in crew_members %}
                <option value="{{ member.id }}" {% if deposit and deposit.member_id == member.id %}selected{% endif %}>
                    {{ member.code }} - {{ member.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">💵 {{ t('common.amount') }} *</label>
            <input type="number" name="amount" step="0.01" value="{% if deposit %}{{ deposit.amount }}{% endif %}" required
                class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue);">
        </div>
        
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">💱 {{ t('common.currency') }} *</label>
            <select name="currency" class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue);">
                <option value="EUR" {% if deposit and deposit.currency.value == 'EUR' %}selected{% endif %}>EUR (€)</option>
                <option value="DKK" {% if deposit and deposit.currency.value == 'DKK' %}selected{% endif %}>DKK (kr)</option>
                <option value="SEK" {% if deposit and deposit.currency.value == 'SEK' %}selected{% endif %}>SEK (kr)</option>
                <option value="GBP" {% if deposit and deposit.currency.value == 'GBP' %}selected{% endif %}>GBP (£)</option>
            </select>
        </div>
        
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">📅 {{ t('common.date') }} *</label>
            <input type="date" name="deposit_date" value="{% if deposit %}{{ deposit.date }}{% endif %}" required
                class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue);">
        </div>
        
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">📝 {{ t('deposit.note_optional') }}</label>
            <input type="text" name="note" value="{% if deposit %}{{ deposit.note or '' }}{% endif %}"
                class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue);">
        </div>
        
        <div class="rope-divider"></div>
        
        <div class="flex gap-4">
            <button type="submit" class="flex-1 text-white font-bold py-3 px-4 rounded-lg transition touch-action" style="background: linear-gradient(135deg, var(--sea-foam) 0%, #27ae60 100%);">
                💾 {{ t('common.save') }}
            </button>
            <a href="/deposits" class="flex-1 text-white font-bold py-3 px-4 rounded-lg text-center transition touch-action" style="background: linear-gradient(135deg, var(--navy-deep) 0%, #0d1f3d 100%);">
                ❌ {{ t('common.cancel') }}
            </a>
        </div>
    </form>
</div>
{% endblock %}
