{% extends "layout.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Einzahlung bearbeiten</h1>
    
    <form method="post" class="bg-white rounded-lg shadow p-6 space-y-4">
        <div>
            <label class="block text-gray-700 font-medium mb-2">Mitglied *</label>
            <select name="member_id" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-lg">
                {% for member in crew_members %}
                <option value="{{ member.id }}" {% if deposit and deposit.member_id == member.id %}selected{% endif %}>
                    {{ member.code }} - {{ member.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label class="block text-gray-700 font-medium mb-2">Betrag (€) *</label>
            <input type="number" name="amount_eur" step="0.01" value="{% if deposit %}{{ deposit.amount_eur }}{% endif %}" required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-lg">
        </div>
        
        <div>
            <label class="block text-gray-700 font-medium mb-2">Datum *</label>
            <input type="date" name="deposit_date" value="{% if deposit %}{{ deposit.date }}{% endif %}" required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-lg">
        </div>
        
        <div>
            <label class="block text-gray-700 font-medium mb-2">Notiz (optional)</label>
            <input type="text" name="note" value="{% if deposit %}{{ deposit.note or '' }}{% endif %}"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-lg">
        </div>
        
        <div class="flex gap-4">
            <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition touch-action">
                Speichern
            </button>
            <a href="/deposits" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg text-center transition touch-action">
                Abbrechen
            </a>
        </div>
    </form>
</div>
{% endblock %}
