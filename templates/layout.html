<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e40af">
    <title>{% block title %}Crew Wallet{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="manifest" href="/static/manifest.json">
    <style>
        @media (max-width: 640px) {
            body {
                padding-bottom: 80px;
            }
        }
        .touch-action {
            touch-action: manipulation;
        }
        input, select, textarea {
            font-size: 16px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-blue-700 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-2">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <a href="/" class="text-xl font-bold">Bordkasse</a>
                </div>
                <button id="menu-toggle" class="lg:hidden p-2 touch-action">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div id="menu" class="hidden lg:flex lg:items-center lg:space-x-6">
                    <a href="/" class="block py-2 lg:py-0 hover:text-blue-200 transition touch-action">Dashboard</a>
                    <a href="/crew" class="block py-2 lg:py-0 hover:text-blue-200 transition touch-action">Crew</a>
                    <a href="/deposits" class="block py-2 lg:py-0 hover:text-blue-200 transition touch-action">Einzahlungen</a>
                    <a href="/expenses" class="block py-2 lg:py-0 hover:text-blue-200 transition touch-action">Ausgaben</a>
                    <a href="/balances" class="block py-2 lg:py-0 hover:text-blue-200 transition touch-action">Salden</a>
                    <a href="/settlement" class="block py-2 lg:py-0 hover:text-blue-200 transition touch-action">Ausgleich</a>
                    <a href="/export/csv" class="block py-2 lg:py-0 hover:text-blue-200 transition touch-action">Export CSV</a>
                </div>
            </div>
            <div id="mobile-menu" class="hidden lg:hidden pb-4">
                <a href="/" class="block py-2 hover:text-blue-200 transition touch-action">Dashboard</a>
                <a href="/crew" class="block py-2 hover:text-blue-200 transition touch-action">Crew</a>
                <a href="/deposits" class="block py-2 hover:text-blue-200 transition touch-action">Einzahlungen</a>
                <a href="/expenses" class="block py-2 hover:text-blue-200 transition touch-action">Ausgaben</a>
                <a href="/balances" class="block py-2 hover:text-blue-200 transition touch-action">Salden</a>
                <a href="/settlement" class="block py-2 hover:text-blue-200 transition touch-action">Ausgleich</a>
                <a href="/export/csv" class="block py-2 hover:text-blue-200 transition touch-action">Export CSV</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white text-center py-4 mt-12">
        <p class="text-sm">Crew Wallet v1.0 - Nur für Reiseabrechnung</p>
        <p class="text-xs text-gray-400 mt-1">Keine Archivfunktion über den Törn hinaus</p>
    </footer>

    <script>
        document.getElementById('menu-toggle').addEventListener('click', function() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
