<!DOCTYPE html>
<html lang="{{ lang|default('de') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a2f4a">
    <title>{{ t('reset.title') }} - CrewLog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/ui_v1.css">
    <style>
        body {
            background: linear-gradient(180deg, #1a2f4a 0%, #0d3b5e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }
        .logo-float {
            animation: gentleFloat 4s ease-in-out infinite;
        }
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        input { font-size: 16px; }
    </style>
</head>
<body>
    <div class="w-full max-w-md px-4">
        <div class="flex justify-end mb-4">
            <div class="lang-pill">
                <a href="/set-language?lang=de&next=/reset-password{% if token %}?token={{ token }}{% endif %}" class="{% if lang == 'de' %}lang-active{% endif %}" style="padding: 0.3rem 0.7rem; font-size: 0.8rem;">DE</a>
                <a href="/set-language?lang=en&next=/reset-password{% if token %}?token={{ token }}{% endif %}" class="{% if lang == 'en' %}lang-active{% endif %}" style="padding: 0.3rem 0.7rem; font-size: 0.8rem;">EN</a>
            </div>
        </div>

        <div class="text-center mb-8">
            <div class="logo-float mb-4 flex justify-center">
                <img src="/static/logo-crewlog.svg" alt="CrewLog Logo" class="w-20 h-20 object-contain">
            </div>
            <h1 class="text-3xl font-bold text-white mb-1" style="letter-spacing: -0.02em;">CrewLog</h1>
        </div>

        <div class="login-card p-8">
            <div class="text-center mb-6 pb-4" style="border-bottom: 1px solid var(--border-light);">
                <h2 class="text-xl font-bold" style="color: var(--text);">{{ t('reset.heading') }}</h2>
            </div>

            {% if not valid %}
            <div class="text-center py-4">
                <div class="mb-4" style="font-size: 2.5rem; color: var(--danger);">&#9888;</div>
                <p class="text-base font-medium mb-2" style="color: var(--text);">{{ t(error_key) }}</p>
                <p class="text-sm mb-6" style="color: var(--muted);">{{ t('reset.try_again_hint') }}</p>
                <a href="/forgot-password" class="btn btn-primary w-full py-3 text-base inline-block text-center">
                    {{ t('reset.request_new_link') }}
                </a>
            </div>
            {% else %}

            {% if error_key %}
            <div class="alert alert-danger mb-4" role="alert">
                <span>{{ t(error_key) }}</span>
            </div>
            {% endif %}

            <form method="post" action="/reset-password" class="space-y-5">
                {{ csrf_input | safe }}
                <input type="hidden" name="token" value="{{ token }}">

                <div>
                    <label class="block text-sm font-medium mb-1.5" style="color: var(--text);">
                        {{ t('reset.new_password') }}
                    </label>
                    <input
                        type="password"
                        name="password"
                        required
                        autofocus
                        minlength="8"
                        class="w-full px-4 py-3 rounded-lg text-base"
                        style="border: 1px solid var(--border);"
                        placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
                    <p class="text-xs mt-1" style="color: var(--muted);">{{ t('reset.password_hint') }}</p>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1.5" style="color: var(--text);">
                        {{ t('reset.confirm_password') }}
                    </label>
                    <input
                        type="password"
                        name="password_confirm"
                        required
                        minlength="8"
                        class="w-full px-4 py-3 rounded-lg text-base"
                        style="border: 1px solid var(--border);"
                        placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-full py-3 text-base">
                    {{ t('reset.submit') }}
                </button>
            </form>
            {% endif %}
        </div>

        <div class="text-center mt-6 text-sm" style="color: rgba(255,255,255,0.4);">
            <p>CrewLog</p>
        </div>
    </div>
</body>
</html>
