{% extends "layout.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold maritime-header mb-6" style="color: var(--navy-deep);">{% if template %}⚓ Vorlage bearbeiten{% else %}➕ Neue Vorlage{% endif %}</h1>
    
    <form method="post" class="bg-white porthole-card p-6 space-y-4">
        {{ csrf_input | safe }}
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">📝 Name *</label>
            <input type="text" name="name" value="{% if template %}{{ template.name }}{% endif %}" required maxlength="100"
                class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue); focus:ring-color: var(--ocean-blue);"
                placeholder="z.B. Diesel tanken">
        </div>
        
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">🏷️ Kategorie *</label>
            <input type="text" name="category" value="{% if template %}{{ template.category }}{% endif %}" required maxlength="50"
                class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue); focus:ring-color: var(--ocean-blue);"
                placeholder="z.B. Fuel, Food, Marina">
        </div>
        
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">💵 Standard-Betrag (optional)</label>
            <input type="number" name="default_amount" step="0.01" min="0.01" value="{% if template and template.default_amount %}{{ template.default_amount }}{% endif %}"
                class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue); focus:ring-color: var(--ocean-blue);"
                placeholder="Leer lassen, wenn variabel">
        </div>
        
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">💱 Währung</label>
            <select name="currency" required class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue);">
                {% for curr in currency_options %}
                <option value="{{ curr }}" {% if template and template.currency.value == curr %}selected{% elif not template and curr == 'EUR' %}selected{% endif %}>{{ curr }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">💰 Bezahlt von</label>
            <select name="paid_from" required class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue);">
                <option value="wallet" {% if template and template.paid_from.value == 'wallet' %}selected{% elif not template %}selected{% endif %}>💰 Bordkasse</option>
                <option value="private" {% if template and template.paid_from.value == 'private' %}selected{% endif %}>👤 Privat</option>
            </select>
        </div>
        
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">🎯 Aufteilungsmodus</label>
            <select name="split_mode" required class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue);">
                <option value="equal" {% if template and template.split_mode.value == 'equal' %}selected{% elif not template %}selected{% endif %}>⚖️ Gleichmäßig (alle Crew)</option>
                <option value="participants" {% if template and template.split_mode.value == 'participants' %}selected{% endif %}>👥 Teilnehmer (auswählbar)</option>
                <option value="percentage" {% if template and template.split_mode.value == 'percentage' %}selected{% endif %}>📊 Prozentsatz</option>
            </select>
        </div>
        
        <div class="rope-divider"></div>
        
        <div class="bg-blue-50 border border-blue-200 text-blue-800 px-4 py-3 rounded-lg">
            <p class="text-sm">💡 <strong>Hinweis:</strong> Diese Werte sind Vorschläge. Bei der Verwendung können alle Felder noch angepasst werden.</p>
        </div>
        
        <div class="flex gap-4">
            <button type="submit" class="flex-1 ocean-gradient text-white font-bold py-3 px-4 rounded-lg transition touch-action">
                💾 Speichern
            </button>
            <a href="/templates" class="flex-1 text-white font-bold py-3 px-4 rounded-lg text-center transition touch-action" style="background: linear-gradient(135deg, var(--navy-deep) 0%, #0d1f3d 100%);">
                ❌ Abbrechen
            </a>
        </div>
    </form>
</div>
{% endblock %}
