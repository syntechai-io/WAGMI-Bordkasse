{% extends "layout.html" %}

{% block title %}{{ t('offline.title') }} - CrewLog{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-16 px-4 text-center">
    <div class="text-6xl mb-6" style="opacity: 0.3;">⚓</div>
    <h1 class="page-title mb-3">{{ t('offline.title') }}</h1>
    <p class="text-base mb-6 prose-width" style="color: var(--text-secondary);">
        {{ t('offline.message') }}
    </p>
    <a href="/" class="btn btn-primary">{{ t('offline.retry') }}</a>
</div>
{% endblock %}
