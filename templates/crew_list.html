{% extends "layout.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-gray-800">Crew-Mitglieder</h1>
        <a href="/crew/new" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition touch-action">
            + Neu
        </a>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Code</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">IBAN/Handle</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Aktionen</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    {% for member in crew_members %}
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap font-semibold text-blue-600">{{ member.code }}</td>
                        <td class="px-6 py-4 whitespace-nowrap">{{ member.name }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ member.iban_or_handle or '-' }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                            <a href="/crew/{{ member.id }}/edit" class="text-blue-600 hover:text-blue-800 touch-action">Bearbeiten</a>
                            <form action="/crew/{{ member.id }}/delete" method="post" class="inline" onsubmit="return confirm('Wirklich löschen?')">
                                <button type="submit" class="text-red-600 hover:text-red-800 touch-action">Löschen</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
