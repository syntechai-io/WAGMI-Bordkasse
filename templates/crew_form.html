{% extends "layout.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold maritime-header mb-6" style="color: var(--navy-deep);">{% if member %}⚓ Crew-Mitglied bearbeiten{% else %}➕ Neues Crew-Mitglied{% endif %}</h1>
    
    {% if error %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg porthole-card mb-4" role="alert">
        <strong class="font-bold">⚠️ Fehler!</strong>
        <span class="block sm:inline">{{ error }}</span>
    </div>
    {% endif %}
    
    <form method="post" class="bg-white porthole-card p-6 space-y-4">
        {{ csrf_token }}
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">📝 Code *</label>
            <input type="text" name="code" value="{% if member %}{{ member.code }}{% endif %}" required maxlength="20"
                class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue); focus:ring-color: var(--ocean-blue);">
        </div>
        
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">👤 Name *</label>
            <input type="text" name="name" value="{% if member %}{{ member.name }}{% endif %}" required
                class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue); focus:ring-color: var(--ocean-blue);">
        </div>
        
        <div>
            <label class="block font-medium mb-2" style="color: var(--navy-deep);">🏦 IBAN/Handle (optional)</label>
            <input type="text" name="iban_or_handle" value="{% if member %}{{ member.iban_or_handle or '' }}{% endif %}"
                class="w-full px-4 py-3 border rounded-lg text-lg" style="border-color: var(--sky-blue); focus:ring-color: var(--ocean-blue);">
        </div>
        
        <div class="rope-divider"></div>
        
        <div class="flex gap-4">
            <button type="submit" class="flex-1 ocean-gradient text-white font-bold py-3 px-4 rounded-lg transition touch-action">
                💾 Speichern
            </button>
            <a href="/crew" class="flex-1 text-white font-bold py-3 px-4 rounded-lg text-center transition touch-action" style="background: linear-gradient(135deg, var(--navy-deep) 0%, #0d1f3d 100%);">
                ❌ Abbrechen
            </a>
        </div>
    </form>
</div>
{% endblock %}
