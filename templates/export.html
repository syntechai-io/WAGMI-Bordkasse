{% extends "layout.html" %}

{% block content %}
<div class="space-y-6">
    <h1 class="text-4xl font-bold maritime-header" style="color: var(--navy-deep);">📋 Daten exportieren</h1>
    
    <div class="bg-white porthole-card p-8 text-center">
        <div class="mb-6">
            <div class="text-6xl mb-4">📊</div>
            <h2 class="text-2xl font-bold maritime-header mb-2" style="color: var(--navy-deep);">CSV Export</h2>
            <p class="text-gray-600">Exportiere alle Crew-Mitglieder, Einzahlungen und Ausgaben als CSV-Datei.</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <button onclick="downloadCSV()" class="inline-block text-white px-8 py-4 rounded-lg transition transform hover:scale-105 touch-action font-semibold text-lg cursor-pointer" style="background: linear-gradient(135deg, var(--ocean-blue) 0%, #005a8c 100%);">
                    📥 CSV herunterladen
                </button>
            </div>
            
            <div>
                <a href="/" class="inline-block text-white px-8 py-4 rounded-lg transition transform hover:scale-105 touch-action font-semibold text-lg" style="background: linear-gradient(135deg, var(--sea-foam) 0%, #27ae60 100%);">
                    🧭 Zurück zum Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

<script>
function downloadCSV() {
    // Create a hidden iframe to trigger the download
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = '/export/download';
    document.body.appendChild(iframe);
    
    // Clean up after download starts (5 seconds is safe)
    setTimeout(() => {
        document.body.removeChild(iframe);
    }, 5000);
}
</script>
{% endblock %}
