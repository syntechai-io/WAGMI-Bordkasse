{% extends "layout.html" %}

{% block content %}
<div class="space-y-6">
    <h1 class="text-4xl font-bold maritime-header" style="color: var(--navy-deep);">📋 Daten exportieren</h1>
    
    <div class="bg-white porthole-card p-8 text-center">
        <div class="mb-6">
            <div class="text-6xl mb-4">📊</div>
            <h2 class="text-2xl font-bold maritime-header mb-2" style="color: var(--navy-deep);">PDF Export</h2>
            <p class="text-gray-600">Exportiere alle Crew-Mitglieder, Einzahlungen und Ausgaben als PDF-Datei.</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <button onclick="downloadPDF()" id="pdfBtn" class="inline-block text-white px-8 py-4 rounded-lg transition transform hover:scale-105 touch-action font-semibold text-lg cursor-pointer" style="background: linear-gradient(135deg, var(--ocean-blue) 0%, #005a8c 100%);">
                    <span id="pdfText">📥 PDF herunterladen</span>
                    <span id="pdfLoading" class="hidden">⏳ Wird erstellt...</span>
                </button>
            </div>
            
            <div>
                <a href="/" class="inline-block text-white px-8 py-4 rounded-lg transition transform hover:scale-105 touch-action font-semibold text-lg" style="background: linear-gradient(135deg, var(--sea-foam) 0%, #27ae60 100%);">
                    🧭 Zurück zum Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

<script>
async function downloadPDF() {
    const btn = document.getElementById('pdfBtn');
    const pdfText = document.getElementById('pdfText');
    const pdfLoading = document.getElementById('pdfLoading');
    
    // Show loading state
    pdfText.classList.add('hidden');
    pdfLoading.classList.remove('hidden');
    btn.disabled = true;
    btn.style.opacity = '0.7';
    
    try {
        const response = await fetch('/export/pdf');
        
        if (!response.ok) {
            throw new Error('Download failed');
        }
        
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'crew_wallet_export.pdf';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
    } catch (error) {
        console.error('PDF download failed:', error);
        alert('Download fehlgeschlagen. Bitte versuchen Sie es erneut.');
    } finally {
        // Reset button state
        pdfText.classList.remove('hidden');
        pdfLoading.classList.add('hidden');
        btn.disabled = false;
        btn.style.opacity = '1';
    }
}
</script>
{% endblock %}
